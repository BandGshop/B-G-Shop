<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/jpeg" href="images/bglogo.jpeg" />
  <title>B&G Shop | Panier</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .cart-page { width: min(900px, calc(100% - 2rem)); margin: 0 auto; padding: 5rem 0 4rem; }
    .cart-page h1 { margin-bottom: 1.5rem; }
    .cart-list { display: grid; gap: .75rem; }
    .cart-item { display: flex; align-items: center; gap: 1rem; padding: .8rem; background: #fff; border: 1px solid var(--line); border-radius: 9px; }
    .cart-item img { width: 80px; height: 70px; border-radius: 6px; object-fit: cover; }
    .cart-item-info { flex: 1; }
    .cart-item-info h2 { margin: 0 0 .2rem; font-size: 1rem; }
    .cart-item-info p { margin: 0; color: var(--muted); }
    .cart-remove { border: 0; background: transparent; color: #b34b36; cursor: pointer; font: inherit; }
    .cart-total { display: flex; justify-content: space-between; margin-top: 1.3rem; padding-top: 1rem; border-top: 1px solid var(--line); font-size: 1.2rem; font-weight: 800; }
    .checkout-panel { margin-top: 1.5rem; padding: 1.25rem; border: 1px solid var(--line); border-radius: 12px; }
    .checkout-panel[hidden] { display: none; }
    .checkout-panel label { display: block; margin: .75rem 0; }
  </style>
</head>
<body>
  <nav class="navbar"><a class="navbar-logo" href="index.html"><img src="images/bglogo.jpeg" alt="B&G Shop logo" class="site-logo" /><span>B&G Shop</span></a><div id="auth-container"></div></nav>
  <main class="page-content cart-page"><p class="eyebrow">Votre sélection</p><h1>Panier</h1><div class="cart-list" id="cart-list"></div><div class="promo-box" style="margin-top: 1.5rem; padding: 1rem; border: 1px solid var(--line); border-radius: 12px; background: rgba(255,255,255,0.04);"><label for="promo-code">Code promo</label><div style="display: flex; gap: 0.5rem; margin-top: 0.5rem;"><input id="promo-code" type="text" placeholder="Ex. MAYA10" style="flex: 1;" /><button class="btn btn-secondaire" type="button" onclick="applyCartPromo()">Appliquer</button></div><div id="promo-message" style="margin-top: 0.75rem; min-height: 1.2rem; color: var(--accent-2);"></div></div><div class="cart-total"><span>Total</span><span id="cart-total">0 FCFA</span></div><button id="checkout-button" class="btn btn-primaire" type="button" onclick="confirmOrder()">Confirmer l'achat</button>
    <form id="checkout-panel" class="checkout-panel" hidden>
      <h2>Finaliser la commande</h2>
      <label for="checkout-name">Nom complet</label><input id="checkout-name" required />
      <label for="checkout-phone">Téléphone</label><input id="checkout-phone" type="tel" required />
      <label for="checkout-address">Adresse de livraison</label><textarea id="checkout-address" required></textarea>
      <fieldset><legend>Mode de paiement</legend>
        <label><input type="radio" name="checkout-payment-method" value="cash_on_delivery" checked /> Paiement à la livraison</label>
        <label><input type="radio" name="checkout-payment-method" value="mobile_money" /> MTN Mobile Money</label>
      </fieldset>
      <div id="checkout-mobile-money" hidden>
        <p id="checkout-payment-numbers">Chargement des numéros de paiement…</p>
        <label for="checkout-payment-proof">Preuve de paiement</label>
        <input id="checkout-payment-proof" type="file" accept="image/*" />
      </div>
      <button id="checkout-submit" class="btn btn-primaire" type="submit">Envoyer la commande</button>
      <button class="btn btn-secondaire" type="button" onclick="closeCheckout()">Annuler</button>
      <p id="checkout-status" role="status" aria-live="polite"></p>
    </form>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/app.js"></script>
  <script>
    let currentCartPromo = null;
    const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (character) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[character]);

    async function applyCartPromo() {
      if (!app.checkAuth()) {
        document.getElementById('promo-message').textContent = 'Connectez-vous pour vérifier les codes promo.';
        return;
      }
      const products = app.getCart().map((id) => app.getProduct(id)).filter(Boolean);
      const subtotal = products.reduce((total, product) => total + Number(product.price || 0), 0);
      const code = document.getElementById('promo-code').value.trim();
      if (!code) {
        currentCartPromo = null;
        document.getElementById('promo-message').textContent = 'Saisissez un code promo.';
        renderCart();
        return;
      }
      try {
        const result = await app.applyPromoToAmount(subtotal, code);
        document.getElementById('promo-message').textContent = result.message || 'Code promo invalide.';
        currentCartPromo = result.valid ? result : null;
        renderCart();
      } catch (error) {
        document.getElementById('promo-message').textContent = error.message || 'Impossible de vérifier le code promo.';
      }
    }

    function renderCart() {
      const products = app.getCart().map((id) => app.getProduct(id)).filter(Boolean);
      document.getElementById('cart-list').innerHTML = products.length ? products.map((product) => `<article class="cart-item"><img src="${escapeHtml(product.image || 'images/ad-placeholder.svg')}" alt="${escapeHtml(product.title)}"><div class="cart-item-info"><h2>${escapeHtml(product.title)}</h2><p>${Number(product.price || 0)} FCFA</p></div><button class="cart-remove" onclick="removeItem(${Number(product.id)})">Retirer</button></article>`).join('') : '<p>Votre panier est vide.</p>';
      const subtotal = products.reduce((total, product) => total + Number(product.price || 0), 0);
      const total = currentCartPromo && currentCartPromo.valid ? currentCartPromo.finalAmount : subtotal;
      document.getElementById('cart-total').textContent = `${total} FCFA`;
      document.getElementById('checkout-button').disabled = products.length === 0;
      if (currentCartPromo && currentCartPromo.valid) {
        document.getElementById('cart-total').title = `${currentCartPromo.discountPercent}% de réduction appliquée`;
      } else document.getElementById('cart-total').removeAttribute('title');
    }
    function removeItem(productId) {
      app.removeFromCart(productId);
      currentCartPromo = null;
      document.getElementById('promo-message').textContent = '';
      renderCart();
    }

    async function confirmOrder() {
      if (!app.checkAuth()) {
        window.location.href = 'login.html';
        return;
      }
      const panel = document.getElementById('checkout-panel');
      panel.hidden = false;
      document.getElementById('checkout-name').value = app.checkAuth().name || '';
      document.getElementById('checkout-phone').focus();
      try {
        const numbers = await app.getPaymentNumbers();
        document.getElementById('checkout-payment-numbers').textContent = numbers.length
          ? `Faites le dépôt MTN sur : ${numbers.map((number) => `${number.phone}${number.label ? ` (${number.label})` : ''}`).join(', ')}`
          : "Aucun numéro MTN n'est disponible. Choisissez le paiement à la livraison.";
      } catch (error) {
        document.getElementById('checkout-payment-numbers').textContent = error.message || 'Impossible de charger les numéros de paiement.';
      }
    }

    function closeCheckout() {
      document.getElementById('checkout-panel').hidden = true;
    }

    function toggleCheckoutPaymentFields() {
      const mobileMoney = document.querySelector('input[name="checkout-payment-method"]:checked')?.value === 'mobile_money';
      document.getElementById('checkout-mobile-money').hidden = !mobileMoney;
      document.getElementById('checkout-payment-proof').required = mobileMoney;
    }

    document.querySelectorAll('input[name="checkout-payment-method"]').forEach((input) => input.addEventListener('change', toggleCheckoutPaymentFields));
    document.getElementById('checkout-panel').addEventListener('submit', async (event) => {
      event.preventDefault();
      const user = app.checkAuth();
      const products = app.getCart().map((id) => app.getProduct(id)).filter(Boolean);
      if (!user || !products.length) return;

      const paymentMethod = document.querySelector('input[name="checkout-payment-method"]:checked')?.value || 'cash_on_delivery';
      const proofFile = document.getElementById('checkout-payment-proof').files[0];
      if (paymentMethod === 'mobile_money' && !proofFile) {
        document.getElementById('checkout-status').textContent = 'Veuillez joindre la preuve de paiement.';
        return;
      }
      if (proofFile && (proofFile.size > 5 * 1024 * 1024 || !proofFile.type.startsWith('image/'))) {
        document.getElementById('checkout-status').textContent = 'La preuve doit être une image de 5 Mo maximum.';
        return;
      }

      const submit = document.getElementById('checkout-submit');
      const status = document.getElementById('checkout-status');
      submit.disabled = true;
      status.textContent = 'Envoi de la commande…';
      try {
        const paymentProof = proofFile ? await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = () => reject(new Error('Impossible de lire la preuve de paiement.'));
          reader.readAsDataURL(proofFile);
        }) : null;
        const subtotal = products.reduce((sum, product) => sum + Number(product.price || 0), 0);
        const promo = currentCartPromo
          ? await app.applyPromoToAmount(subtotal, currentCartPromo.code)
          : null;
        if (currentCartPromo && !promo?.valid) {
          currentCartPromo = null;
          renderCart();
          throw new Error('Le code promo n’est plus valide. Vérifiez le nouveau total avant de commander.');
        }
        await app.addOrder({
          customerName: document.getElementById('checkout-name').value.trim(),
          customerPhone: document.getElementById('checkout-phone').value.trim(),
          customerAddress: document.getElementById('checkout-address').value.trim(),
          userId: user.id,
          userEmail: user.email,
          paymentMethod,
          paymentProof,
          items: products.map((product) => ({
            productId: product.id,
            productTitle: product.title,
            productPrice: Number(product.price || 0),
            quantity: 1
          })),
          discountCode: promo?.valid ? promo.code : null,
          discountPercent: promo?.valid ? promo.discountPercent : 0,
          discountAmount: promo?.valid ? promo.discountAmount : 0,
          partnerName: promo?.valid ? promo.partnerName : null,
          finalTotal: promo?.valid ? promo.finalAmount : subtotal
        });
        for (const product of products) app.removeFromCart(product.id);
        alert('Commande envoyée avec succès !');
        window.location.href = 'index.html';
      } catch (error) {
        status.textContent = error.message || 'Impossible d’envoyer la commande.';
      } finally {
        submit.disabled = false;
      }
    });

    document.addEventListener('DOMContentLoaded', async () => {
      await app.ready?.catch((error) => console.error('Échec du chargement Supabase :', error));
      renderCart();
    });
  </script>
</body>
</html>
