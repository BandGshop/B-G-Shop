<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>B&G Shop | Connexion</title>
        <link rel="stylesheet" href="styles.css" />
        <style>
            .auth-container {
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 2rem;
            }

            .auth-form {
                width: 100%;
                max-width: 420px;
                padding: 2rem;
                border-radius: 24px;
                background: rgba(255, 255, 255, 0.08);
                border: 1px solid var(--bordure);
            }

            .auth-brand {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 0.75rem;
                margin-bottom: 1.25rem;
            }

            .auth-brand img {
                width: 42px;
                height: 42px;
            }

            .auth-form h2 {
                margin: 0 0 1.5rem;
                text-align: center;
                font-size: 1.8rem;
            }

            .form-group {
                margin-bottom: 1.2rem;
            }

            .form-group label {
                display: block;
                margin-bottom: 0.5rem;
                font-weight: 500;
            }

            .form-group input {
                width: 100%;
                padding: 0.8rem;
                border-radius: 12px;
                border: 1px solid var(--bordure);
                background: rgba(255, 255, 255, 0.08);
                color: var(--texte);
                font-size: 1rem;
            }

            .form-group input:focus {
                outline: none;
                border-color: var(--accent-2);
                box-shadow: 0 0 0 3px rgba(255, 63, 149, 0.2);
            }

            .form-actions {
                display: flex;
                gap: 1rem;
                margin-top: 1.5rem;
            }

            .form-actions button {
                flex: 1;
            }

            .toggle-form {
                text-align: center;
                margin-top: 1rem;
                color: var(--texte-secondaire);
            }

            .toggle-form a {
                color: var(--accent-2);
                cursor: pointer;
                text-decoration: underline;
            }

            .error-message {
                color: #ff6b6b;
                font-size: 0.9rem;
                margin-top: 0.3rem;
            }

            .success-message {
                color: #51cf66;
                font-size: 0.9rem;
                margin-top: 0.3rem;
            }

            #register-form {
                display: none;
            }
        </style>
    </head>
    <body>
        <div class="auth-container">

            <!-- LOGIN FORM -->

            <div class="auth-form" id="login-form">
                <div class="auth-brand">
                    <img src="images/bglogo.jpeg" alt="B&G Shop logo" />
                    <span style="font-size: 1.5rem; font-weight: bold; color: var(--accent-2);">B&G Shop</span>
                </div>
                <h2>Connexion</h2>
                <div class="form-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" placeholder="votre@email.com" />
                    <div id="login-email-error" class="error-message"></div>
                </div>
                <div class="form-group">
                    <label for="login-password">Mot de passe</label>
                    <input type="password" id="login-password" placeholder="••••••••" />
                    <div id="login-password-error" class="error-message"></div>
                </div>
                <div class="form-actions">
                    <button class="btn btn-primaire" onclick="handleLogin()">Connexion</button>
                </div>
                <p class="toggle-form">Pas encore de compte? <a onclick="toggleForms()">S'inscrire</a></p>
                <div id="login-error" class="error-message" style="text-align: center"></div>
            </div>

            <!-- REGISTER FORM -->

            <div class="auth-form" id="register-form">
                <h2>Inscription</h2>
                <div class="form-group">
                    <label for="register-name">Nom complet</label>
                    <input type="text" id="register-name" placeholder="Votre nom complet" />
                    <div id="register-name-error" class="error-message"></div>
                </div>
                <div class="form-group">
                    <label for="register-email">Email</label>
                    <input type="email" id="register-email" placeholder="exemple@email.com" />
                    <div id="register-email-error" class="error-message"></div>
                </div>
                <div class="form-group">
                    <label for="register-password">Mot de passe</label>
                    <input type="password" id="register-password" placeholder="••••••••" />
                    <div id="register-password-error" class="error-message"></div>
                </div>
                <div class="form-group">
                    <label for="register-confirm">Confirmer le mot de passe</label>
                    <input type="password" id="register-confirm" placeholder="••••••••" />
                    <div id="register-confirm-error" class="error-message"></div>
                </div>
                <div class="form-actions">
                    <button class="btn btn-primaire" onclick="handleRegister()">S'inscrire</button>
                </div>
                <p class="toggle-form">Déjà inscrit? <a onclick="toggleForms()">Se connecter</a></p>
                <div id="register-error" class="error-message" style="text-align: center"></div>
            </div>
        </div>

        <script src="js/app.js"></script>
        <script>
            function toggleForms() {
                const loginForm = document.getElementById("login-form");
                const registerForm = document.getElementById("register-form");

                // Utiliser getComputedStyle pour obtenir le vrai display
                const loginDisplay = getComputedStyle(loginForm).display;
                const registerDisplay = getComputedStyle(registerForm).display;

                // Basculer l'affichage
                loginForm.style.display = loginDisplay === "none" ? "block" : "none";
                registerForm.style.display = registerDisplay === "none" ? "block" : "none";
            }

            function handleLogin() {
                const email = document.getElementById("login-email").value;
                const password = document.getElementById("login-password").value;

                if (!email || !password) {
                    document.getElementById("login-error").textContent = "Veuillez remplir tous les champs";
                    return;
                }

                const result = app.login(email, password);
                if (result.success) {
                    window.location.href = "index.html";
                } else {
                    document.getElementById("login-error").textContent = result.message;
                }
            }

            function handleRegister() {
                const name = document.getElementById("register-name").value;
                const email = document.getElementById("register-email").value;
                const password = document.getElementById("register-password").value;
                const confirm = document.getElementById("register-confirm").value;

                let hasError = false;

                if (!name) {
                    document.getElementById("register-name-error").textContent = "Le nom est requis";
                    hasError = true;
                } else {
                    document.getElementById("register-name-error").textContent = "";
                }

                if (!email) {
                    document.getElementById("register-email-error").textContent = "L'email est requis";
                    hasError = true;
                } else {
                    document.getElementById("register-email-error").textContent = "";
                }

                if (!password || password.length < 6) {
                    document.getElementById("register-password-error").textContent =
                        "Le mot de passe doit contenir au moins 6 caractères";
                    hasError = true;
                } else {
                    document.getElementById("register-password-error").textContent = "";
                }

                if (password !== confirm) {
                    document.getElementById("register-confirm-error").textContent =
                        "Les mots de passe ne correspondent pas";
                    hasError = true;
                } else {
                    document.getElementById("register-confirm-error").textContent = "";
                }

                if (hasError) return;

                const result = app.register(email, password, name);
                if (result.success) {
                    window.location.href = "index.html";
                } else {
                    document.getElementById("register-error").textContent = result.message;
                }
            }

            // Enter key to submit
            document.addEventListener("keypress", (e) => {
                if (e.key === "Enter") {
                    if (document.getElementById("login-form").style.display !== "none") {
                        handleLogin();
                    } else {
                        handleRegister();
                    }
                }
            });
        </script>
    </body>
</html>
